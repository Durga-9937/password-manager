<mat-card class="dashboard-card">
  <h2>Recycle Bin</h2>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Username</th>
      <td mat-cell *matCellDef="let element">{{ element.username }}</td>
    </ng-container>

    <ng-container matColumnDef="comments">
      <th mat-header-cell *matHeaderCellDef>Comments</th>
      <td mat-cell *matCellDef="let element">{{ element.comments }}</td>
    </ng-container>

    <ng-container matColumnDef="deletedAt">
      <th mat-header-cell *matHeaderCellDef>Deleted At</th>
      <td mat-cell *matCellDef="let element">{{ element.deletedAt | date:'dd-MM-yyyy HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="restoreUser(element)">
          <mat-icon>restore</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deletePermanently(element)">
          <mat-icon>delete_forever</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length" style="text-align:center;">
        No deleted users
      </td>
    </tr>
  </table>
</mat-card>
